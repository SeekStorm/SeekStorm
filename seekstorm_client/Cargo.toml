[package]
name = "seekstorm_client_rs"
version = "5.3.0"
authors = ["Wolf Garbe <wolf.garbe@seekstorm.com>"]
license = "Apache-2.0"
categories = ["database-implementations", "data-structures"]
description = """Rust Client for SeekStorm vector & lexical search server"""
documentation = "https://docs.rs/seekstorm_client_rs"
homepage = "https://seekstorm.com"
repository = "https://github.com/SeekStorm/SeekStorm"
readme = "README.md"
keywords = ["search", "information", "retrieval"]
edition = "2024"

[lib]
name = "seekstorm_client_rs"
path = "src/lib.rs"

[dependencies]
base64 = "0.23.1"
reqwest = { version = "0.13.5", features = ["json"] }
seekstorm =  { version = "5.3.0", path = "../seekstorm", default-features = false , features = ["zh", "vb"] }
serde_json = "1.0.154"
tokio = "1.54.1"

[dev-dependencies]
tokio-test = "0.4.6"
jiff = "1.0.3"

[lints]
workspace = true