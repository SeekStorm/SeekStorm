[package]
name = "seekstorm_mcp_server"
version = "3.4.0"
authors = ["Wolf Garbe <wolf.garbe@seekstorm.com>"]
license = "Apache-2.0"
categories = ["database-implementations", "data-structures"]
description = """MCP server for SeekStorm vector & lexical search"""
documentation = "https://docs.rs/seekstorm_mcp_server"
homepage = "https://seekstorm.com"
repository = "https://github.com/SeekStorm/seekstorm_mcp_server"
readme = "README.md"
keywords = ["search", "information", "retrieval"]
edition = "2024"

[[bin]]
name = "seekstorm_mcp_server"
path = "src/main.rs"

[dependencies]
chrono = "0.4.45"
base64 = "0.23.1"
# reqwest = { version = "0.13.5", features = ["json"] }
rmcp = { version = "3.5.0", features = ["transport-io"] }
seekstorm =  { version = "3.4.0", path = "../seekstorm", default-features = false , features = ["zh", "vb", "pdf"] }
serde = { version = "1.0.151", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.2", features = ["full"] }
tokio-test = "0.4.6"

[dev-dependencies]
tempfile = "3"
